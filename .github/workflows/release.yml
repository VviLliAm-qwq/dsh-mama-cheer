name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write      # GitHub Release
  id-token: write      # npm trusted publishing + provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      # prepublishOnly runs the same verification again inside npm publish, so
      # the tarball always comes from a freshly checked tree.
      - run: pnpm check:encoding
      - run: pnpm test
      - run: pnpm validate:manifest
      - run: pnpm pack:verify

      # Trusted publishing: the npm CLI exchanges this workflow's short-lived
      # OIDC token — granted by `id-token: write` above — for a publish
      # credential, so this repository stores no npm token at all. npm >= 11.5.1
      # is the version that understands the exchange.
      - name: Update npm for trusted publishing
        run: npm install -g npm@11

      - name: Publish to npm
        run: |
          # ONE-TIME first publish only (the whole `env:` block below plus this
          # line are deleted once the trusted publisher is registered). npm
          # trusted publishing cannot be configured for a package that does not
          # exist yet, so this release authenticates with an Automation token —
          # and NODE_AUTH_TOKEN alone is not enough: npm only reads it when an
          # .npmrc entry interpolates it, which `setup-node` writes only when
          # `registry-url` is set. Writing the line here keeps the blast radius
          # to this one step and leaves the OIDC-only shape intact afterwards.
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
